services:
  # Service de l'application Todo
  app:
    build: .
    image: securedeploy-todo-app:latest
    container_name: todo-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=todo_user
      - DB_PASSWORD=todo_password
      - DB_NAME=tododb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

  # Service PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_password
      - POSTGRES_DB=tododb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - todo-network

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge